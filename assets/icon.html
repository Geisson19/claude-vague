<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vague icon</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 512px; height: 512px; background: #141415; }
  body { display: grid; place-items: center; }
  .lines { display: grid; gap: 30px; width: 340px; }
  .line { display: flex; gap: 22px; }
  .pill { height: 44px; border-radius: 22px; }
</style>
</head>
<body>
<div class="lines">
  <div class="line"><div class="pill" style="width:120px;background:#6e94b2"></div><div class="pill" style="width:150px;background:#d8647e"></div></div>
  <div class="line" style="padding-left:52px"><div class="pill" style="width:96px;background:#6e94b2"></div><div class="pill" style="width:170px;background:#f3be7c"></div></div>
  <div class="line" style="padding-left:52px"><div class="pill" style="width:190px;background:#7fa563"></div><div class="pill" style="width:76px;background:#bb9dbd"></div></div>
  <div class="line"><div class="pill" style="width:64px;background:#aeaed1"></div></div>
</div>
</body>
</html>
